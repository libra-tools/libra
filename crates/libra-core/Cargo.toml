[package]
name = "libra-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
worktree-fuse = []
test-live-agent = []
test-upgrade = []
test-bridge-hooks = []
test-helpers = ["dep:axum", "dep:syn", "dep:proc-macro2"]
fastcdc = ["dep:fastcdc"]
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
keyring = ["dep:keyring"]

[dependencies]
libra-model = { path = "../libra-model" }
anyhow = "1.0.102"
async-trait = "0.1.89"
base64 = "0.22.1"
byte-unit = "5.2.0"
byteorder = "1.5.0"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
crc32fast = "1.5.0"
diffs = "0.5.1"
dirs = "6.0.0"
fancy-regex = "0.16.2"
fastrand = "2.3.0"
flate2 = "1.1.9"
futures = "0.3.32"
futures-util = "0.3.32"
git-internal = "=0.10.4"
hex = "0.4.3"
http = "1.4.0"
ignore = "0.4.25"
indicatif = "0.18.4"
lazy_static = "1.5.0"
libvault = { version = "0.4.0", features = ["storage_sqlite"] }
lru-mem = "0.3.0"
object_store = { version = "0.13.2", features = ["aws", "azure", "gcp", "http"] }
once_cell = "1.21.4"
openssl = { version = "0.10.78", features = ["vendored"] }
path-absolutize = "3.1.1"
pathdiff = "0.2.3"
pgp = "0.19.0"
rand = "0.8.5"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = [
    "stream",
    "json",
    "query",
    "rustls",
] }
ring = "0.17.14"
rpassword = "7.4.0"
rsa = "0.9"
sea-orm = { version = "2.0.0", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
sha1 = "0.11.0"
sha2 = "0.10"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = [
    "io-std",
    "io-util",
    "net",
    "rt-multi-thread",
    "rt",
    "macros",
    "process",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.18", features = ["io"] }
toml = "0.8.23"
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "=0.1.25"
unicode-width = "0.2.2"
url = "2.5.8"
uuid = { version = "1.23.1", features = ["v4", "v5", "v7"] }
walkdir = "2.5.0"
wax = "0.7.0"
zeroize = "1"

fastcdc = { version = "=3.2.1", optional = true }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry_sdk = { version = "0.32.1", optional = true }
opentelemetry-otlp = { version = "0.32.0", optional = true, default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
tracing-opentelemetry = { version = "0.33.0", optional = true }
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
axum = { version = "0.8.9", optional = true }
syn = { version = "2.0", features = ["full", "visit", "visit-mut"], optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }

[target.'cfg(unix)'.dependencies]
errno = "0.3"
libc = "0.2"
libfuse-fs = "0.1.13"
rfuse3 = { version = "0.0.8", features = ["tokio-runtime", "unprivileged"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
axum = "0.8.9"
gag = "1.0.0"
proc-macro2 = { version = "1", features = ["span-locations"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "query", "rustls"] }
serial_test = { version = "3.4.0", default-features = false, features = ["async"] }
syn = { version = "2.0", features = ["full", "visit", "visit-mut"] }
