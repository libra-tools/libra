on:
  pull_request:

name: Check, Build and Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: compat-rustfmt
    runs-on: [self-hosted]

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rustfmt --toolchain nightly

      - name: Run rustfmt
        run: cargo +nightly fmt --all --check

  clippy:
    name: compat-clippy
    strategy:
      fail-fast: true

    runs-on: [self-hosted]
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      LIBRA_SKIP_WEB_BUILD: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check Rustdoc intra-doc links
        run: RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links" cargo doc --no-deps --all-features

  web-check:
    name: compat-web-check
    runs-on: [self-hosted]

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      # Rust-oriented jobs skip the web build for speed. This dedicated job
      # validates the Next.js source, generates a fresh static export, and
      # compiles it into `WebAssets`; the generated directory is deliberately
      # not version-controlled. Per docs/improvement/web.md Phase 5
      # verification.
      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Lint web
        run: pnpm --dir web lint

      - name: Test web
        run: pnpm --dir web test

      - name: Build web (static export → web/out/)
        run: pnpm --dir web build

      - name: Verify generated static export lifecycle
        shell: bash
        run: |
          test -f web/out/index.html
          if git ls-files --error-unmatch -- web/out >/dev/null 2>&1; then
            echo "web/out is generated build output and must not be tracked." >&2
            exit 1
          fi
          git check-ignore -q web/out/index.html

      - name: Check generated export embeds into the Rust binary
        env:
          LIBRA_SKIP_WEB_BUILD: "1"
        run: cargo check --lib

  owner-liveness-macos:
    # plan-20260714 W1 (§C.9): the operation claim decides whether a control
    # action's owner is dead by proving it — boot id + PID namespace on Linux,
    # host UUID + boot time on macOS. The macOS branch has no other coverage,
    # and a failure there does not make claims unsafe, it makes them
    # unreclaimable: a killed command would hold its worktree's control slot
    # until the row is cleared by hand. These five tests are the proof that the
    # platform-specific reads work where they run.
    name: compat-owner-liveness-macos
    runs-on: macos-latest

    env:
      CARGO_TERM_COLOR: always
      LIBRA_SKIP_WEB_BUILD: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Run the claim-owner liveness tests
        run: cargo test --lib -- claim_owner_tests --test-threads=1

  redundancy:
    name: compat-redundancy
    runs-on: [self-hosted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Run redundancy check
        run: |
          if [ ! -d third-party/rust/crates ]; then
            echo "✅ No third-party/rust/crates directory to check"
            exit 0
          fi

          x=$(find third-party/rust/crates -mindepth 2 -maxdepth 2 -type d -exec bash -c '
            n=$(find "$1" -maxdepth 1 -type f | wc -l)
            [ $n -gt 1 ]
          ' _ {} \; -print -quit | wc -l)
          if [ $x -gt 0 ]; then
            echo "❌ Redundant directories found"
            exit 1
          else
            echo "✅ All good"
            exit 0
          fi

  test:
    name: compat-offline-core

    runs-on: [self-hosted]

    # Below GitHub's 360-minute default so an overrun fails as a timeout with
    # the log intact, rather than being reaped at the platform cap.
    timeout-minutes: 350

    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      LIBRA_SKIP_WEB_BUILD: "1"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "1"
      # libtest runs each test in a thread with a 2 MiB stack. An unoptimized
      # async state machine — `switch::execute` and friends inline every
      # awaited future into one frame — does not fit, and the test process
      # ABORTS rather than failing. The real CLI runs those futures on the
      # 8 MiB main thread, so this is a harness limit, not a product one.
      RUST_MIN_STACK: "16777216"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Ensure ripgrep is available
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            SUDO=""
          fi

          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y ripgrep
          elif command -v dnf >/dev/null 2>&1; then
            $SUDO dnf install -y ripgrep
          elif command -v yum >/dev/null 2>&1; then
            $SUDO yum install -y ripgrep
          elif command -v brew >/dev/null 2>&1; then
            brew install ripgrep
          else
            cargo install ripgrep --locked
            echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          fi

          command -v rg
          rg --version

      - name: Preserve Rust toolchain cache paths
        shell: bash
        run: |
          # The test steps below use an isolated HOME for Libra's config, but
          # rustup and Cargo must continue to use the runner's installed
          # toolchains and registry cache.
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"

      - name: Prepare isolated test home
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/libra-ci-home/.config"

      - name: Check compatibility matrix drift
        run: cargo test --test compat_matrix_alignment compatibility_matrix_matches_cli_commands -- --exact

      # plan-20260827 NP-04 / GC-NP-04: pinned nextest install, idempotent.
      - name: Install cargo-nextest (pinned 0.9.143)
        run: |
          if cargo nextest --version 2>/dev/null | grep -q "^cargo-nextest 0.9.143"; then
            echo "cargo-nextest 0.9.143 already installed"
          else
            cargo install cargo-nextest --version 0.9.143 --locked
          fi
          cargo nextest --version

      - name: Run tests (L1 + L2 + L3)
        env:
          # Isolate dirs::home_dir for direct in-process tests without
          # overriding child tests that deliberately choose their own HOME.
          HOME: ${{ runner.temp }}/libra-ci-home
          USERPROFILE: ${{ runner.temp }}/libra-ci-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/libra-ci-home/.config
          LIBRA_TEST_GITHUB_TOKEN: ${{ secrets.LIBRA_TEST_GITHUB_TOKEN }}
          LIBRA_TEST_GITHUB_NAMESPACE: ${{ secrets.LIBRA_TEST_GITHUB_NAMESPACE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LIBRA_D1_ACCOUNT_ID: ${{ secrets.LIBRA_D1_ACCOUNT_ID }}
          LIBRA_D1_API_TOKEN: ${{ secrets.LIBRA_D1_API_TOKEN }}
          LIBRA_D1_DATABASE_ID: ${{ secrets.LIBRA_D1_DATABASE_ID }}
          LIBRA_STORAGE_ENDPOINT: ${{ secrets.LIBRA_STORAGE_ENDPOINT }}
          LIBRA_STORAGE_BUCKET: ${{ secrets.LIBRA_STORAGE_BUCKET }}
          LIBRA_STORAGE_ACCESS_KEY: ${{ secrets.LIBRA_STORAGE_ACCESS_KEY }}
          LIBRA_STORAGE_SECRET_KEY: ${{ secrets.LIBRA_STORAGE_SECRET_KEY }}
        run: |
          set -euo pipefail
          # plan-20260827 NP-04 disposition ①+②: one nextest invocation runs
          # lib + bins + every default-feature integration target INCLUDING
          # command_test — one process per test dissolves the in-process cwd
          # lock that forced the old enumerate-and-exclude dance and the
          # separate compat-offline-command shard job (removed below; group
          # mutual exclusion in .config/nextest.toml only holds inside a
          # single run, so merging is also the correctness-preserving shape).
          # required-features targets are skipped by nextest exactly like
          # `cargo test --all`; the later feature steps run them explicitly.
          # Flake policy mirrors the accepted local canonical semantics
          # (plan-20260827 NP-02 flake ledger): retried-green tests are
          # reported FLAKY explicitly instead of failing the run.
          #
          # ADR-NP-02 rollback (previous commands, verbatim):
          #   mapfile -t TARGETS < <(cargo metadata --no-deps --format-version 1 \
          #     | jq -r '...select(.kind[] == "test")|select(.name != "command_test")...' | sort -u)
          #   cargo test --lib --bins "${ARGS[@]}"
          #   cargo test --doc
          cargo nextest run --all --no-fail-fast --retries 2
          cargo test --doc

      # REMOVED 2026-08-31 — the "Run Code UI automation scenarios" step is
      # dropped because `libra code` TUI support was removed upstream; the
      # PTY/TUI-driven scenario targets (code_ui_scenarios, harness_self_test,
      # lease/SSE/state matrices, ...) no longer describe product behavior.
      # The compatibility guard still inventories these disabled targets:
      #   --test code_codex_default_web_test
      #   --test ai_code_ui_headless_test
      #   --test code_codex_runtime_test
      # The test files remain in the repo for local reference; restore this
      # step from git history if a Code UI surface returns.

      # lore.md 1.7: the OTLP wire test needs the feature compiled in
      # (required-features excludes it from the default `cargo test --all`).
      - name: Run OTLP telemetry wire test (--features otlp)
        env:
          HOME: ${{ runner.temp }}/libra-ci-home
          USERPROFILE: ${{ runner.temp }}/libra-ci-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/libra-ci-home/.config
          LIBRA_SKIP_WEB_BUILD: "1"
        run: |
          cargo test --features otlp --test otlp_telemetry -- --test-threads=1

      # lore.md 2.7: keyring-backend plumbing over the in-process mock store
      # (debug builds only honor the mock env; headless-safe).
      - name: Run keyring auth backend test (--features keyring)
        env:
          HOME: ${{ runner.temp }}/libra-ci-home
          USERPROFILE: ${{ runner.temp }}/libra-ci-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/libra-ci-home/.config
          LIBRA_SKIP_WEB_BUILD: "1"
        run: |
          cargo test --features keyring --test auth_keyring_backend -- --test-threads=1

      # plan-20260714 §A.11: auto-upgrade integration targets. Trust-root and
      # endpoint injection is compile-time only (the `test-upgrade` feature),
      # so a release build cannot alter the trust root even with LIBRA_TEST=1.
      - name: Run auto-upgrade tests (--features test-upgrade)
        env:
          HOME: ${{ runner.temp }}/libra-ci-home
          USERPROFILE: ${{ runner.temp }}/libra-ci-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/libra-ci-home/.config
          LIBRA_SKIP_WEB_BUILD: "1"
          LIBRA_TEST: "1"
        run: |
          cargo test --features test-upgrade \
            --test upgrade_auto_test \
            --test upgrade_publish_contract_test -- --test-threads=1

  # The `command_test` half of what `cargo test --all` used to do in one job.
  # See the note on compat-offline-core's test step for why it is split out:
  # the binary is lock-bound rather than CPU-bound, so the only thing that
  # shortens it is running it in more than one PROCESS. Shards are separate
  # jobs, so each gets its own cwd lock and they scale with the runner pool.
  # plan-20260827 NP-04 disposition ②: the compat-offline-command shard job
  # (4-way name-modulo sharding of command_test) is superseded — command_test
  # now runs inside compat-offline-core's `cargo nextest run --all` with one
  # process per test, which removes the in-process cwd-lock serialization the
  # shard split existed to work around. Cross-job sharding also could not
  # honor the nextest external-resource group (mutual exclusion only holds
  # inside a single run), so the merge is the correctness-preserving shape.
  # Rollback: revert the commit that removed the job (ADR-NP-02).

  network-remotes:
    name: compat-network-remotes
    runs-on: [self-hosted]

    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      LIBRA_SKIP_WEB_BUILD: "1"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Preserve Rust toolchain cache paths
        shell: bash
        run: |
          # The test step below uses an isolated HOME for Libra's config, but
          # rustup and Cargo must continue to use the runner's installed
          # toolchains and registry cache.
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"

      - name: Prepare isolated test home
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/libra-ci-home/.config"

      # Network-only test layer (`test-network` feature gate). Tests requiring outbound
      # network but no secrets are surfaced through this job; tests requiring real
      # credentials live behind `test-live-ai` / `test-live-cloud` and run only in
      # the `compat-live-*` (workflow_dispatch) jobs, which are intentionally not
      # GitHub required-checks.
      - name: Run network-remote tests
        env:
          HOME: ${{ runner.temp }}/libra-ci-home
          USERPROFILE: ${{ runner.temp }}/libra-ci-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/libra-ci-home/.config
        run: cargo test --features test-network --test network_remotes_test -- --test-threads=1

  # plan-20260830 SBX-03 / DEP-SBX-03: Linux-only export-bridge e2e with a
  # trusted bwrap preflight. compat-offline-core is self-hosted and does not
  # guarantee Linux+apt+bwrap, so this job is the D-group oracle
  # (`runs-on: ubuntu-latest`, uname pin, apt install bubblewrap, named
  # gates must not skip).
  opencode-export-linux:
    name: opencode-export-linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
      LIBRA_SKIP_WEB_BUILD: "1"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "16777216"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Pin Linux platform
        run: |
          test "$(uname -s)" = "Linux" || {
            echo "FAIL: uname -s is $(uname -s), expected Linux"
            exit 1
          }

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap_path=$(command -v bwrap)
          # GitHub-hosted Ubuntu runners may disable unprivileged user
          # namespaces. Bubblewrap's documented setuid mode keeps this
          # D-group probe usable without running the test suite as root.
          sudo chmod u+s "$bwrap_path"
          command -v bwrap
          bwrap --version

      - name: Run Linux export sandbox gates
        run: |
          set -euo pipefail
          list=$(cargo test --lib internal::ai::observed_agents::opencode_export -- --list) \
            || { echo "ERROR: --list failed"; exit 2; }
          run_gate() {
            full=$(printf '%s\n' "$list" | sed -n "s/^\(.*::$1\): test$/\1/p" | head -n1)
            [ -n "$full" ] || { echo "FAIL: $1 missing"; exit 1; }
            cargo test --lib "$full" -- --exact --include-ignored \
              || { echo "FAIL: $1"; exit 1; }
          }
          run_gate runner_controls_preserved
          run_gate trusted_bwrap_preflight
          run_gate bwrap_argv_equivalent
          run_gate trusted_bwrap_rejects_user_writable
          run_gate backend_missing_degrades_metadata_only
          run_gate trusted_bwrap_exe_channel_used

      - name: Run OpenCode export bridge e2e (must not skip)
        run: |
          set -euo pipefail
          cargo test --test agent_opencode_bridge_test -- --nocapture | tee /tmp/opencode-bridge.log
          if grep -F "skipped (no trusted, usable bwrap)" /tmp/opencode-bridge.log; then
            echo "FAIL: agent_opencode_bridge_test skipped on Linux D-group"
            exit 1
          fi
