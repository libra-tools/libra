# Verification-only branch: do not merge this replacement into main.
# Retained with its exact run/commit as MIG-06 performance evidence.
name: MIG-06 released-binary benchmark (verification branch only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mig06-released-binary-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/codex/mig06-ci-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verification script without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate harness safety checks
        run: python3 tests/ci/mig06_released_binary_benchmark.py --self-test
      - name: Measure verified release binaries against an isolated 100 MiB fixture
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/mig06-metrics.json
        run: python3 tests/ci/mig06_released_binary_benchmark.py --metrics "$BENCHMARK_OUTPUT"
      - name: Retain small metrics only (never databases or configuration)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mig06-released-binary-metrics
          path: ${{ runner.temp }}/mig06-metrics.json
          if-no-files-found: error
          retention-days: 30
