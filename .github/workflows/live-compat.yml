name: Live compatibility gates

# L3 gates that require real cloud credentials. These jobs are
# intentionally separate from base.yml so they never become required PR checks.
# Missing secrets produce an explicit skip instead of a false failure, which
# keeps forks and local mirrors usable.
#
# The former Code-era live AI job (DeepSeek agent loop/chat) was deleted with
# its targets in plan-20260920; the surviving surface is `libra cloud` D1/R2
# repository backup, covered by compat-live-cloud.

on:
  schedule:
    # Daily at 04:30 UTC.
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live-cloud:
    name: compat-live-cloud
    runs-on: [self-hosted]
    timeout-minutes: 120

    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Check live cloud secrets
        id: gate
        env:
          LIBRA_D1_ACCOUNT_ID: ${{ secrets.LIBRA_D1_ACCOUNT_ID }}
          LIBRA_D1_API_TOKEN: ${{ secrets.LIBRA_D1_API_TOKEN }}
          LIBRA_D1_DATABASE_ID: ${{ secrets.LIBRA_D1_DATABASE_ID }}
          LIBRA_STORAGE_ENDPOINT: ${{ secrets.LIBRA_STORAGE_ENDPOINT }}
          LIBRA_STORAGE_BUCKET: ${{ secrets.LIBRA_STORAGE_BUCKET }}
          LIBRA_STORAGE_ACCESS_KEY: ${{ secrets.LIBRA_STORAGE_ACCESS_KEY }}
          LIBRA_STORAGE_SECRET_KEY: ${{ secrets.LIBRA_STORAGE_SECRET_KEY }}
        run: |
          missing=0
          for name in \
            LIBRA_D1_ACCOUNT_ID \
            LIBRA_D1_API_TOKEN \
            LIBRA_D1_DATABASE_ID \
            LIBRA_STORAGE_ENDPOINT \
            LIBRA_STORAGE_BUCKET \
            LIBRA_STORAGE_ACCESS_KEY \
            LIBRA_STORAGE_SECRET_KEY
          do
            if [ -z "${!name}" ]; then
              echo "::warning::${name} secret is not configured."
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            echo "::warning::Skipping compat-live-cloud because one or more required secrets are missing."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install stable toolchain
        if: steps.gate.outputs.skip != 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Run live cloud tests
        if: steps.gate.outputs.skip != 'true'
        env:
          LIBRA_D1_ACCOUNT_ID: ${{ secrets.LIBRA_D1_ACCOUNT_ID }}
          LIBRA_D1_API_TOKEN: ${{ secrets.LIBRA_D1_API_TOKEN }}
          LIBRA_D1_DATABASE_ID: ${{ secrets.LIBRA_D1_DATABASE_ID }}
          LIBRA_STORAGE_ENDPOINT: ${{ secrets.LIBRA_STORAGE_ENDPOINT }}
          LIBRA_STORAGE_BUCKET: ${{ secrets.LIBRA_STORAGE_BUCKET }}
          LIBRA_STORAGE_ACCESS_KEY: ${{ secrets.LIBRA_STORAGE_ACCESS_KEY }}
          LIBRA_STORAGE_SECRET_KEY: ${{ secrets.LIBRA_STORAGE_SECRET_KEY }}
        run: |
          # cloud_storage_backup_test: `libra cloud` D1 index + R2 object round trip.
          # agent_cloud_tombstone_test: D1 agent-capture mirror tombstone propagation.
          # storage_r2_test is L1 in-memory and already runs in base.yml.
          cargo test --features test-live-cloud \
            --test cloud_storage_backup_test \
            --test agent_cloud_tombstone_test \
            -- --test-threads=1 --nocapture
