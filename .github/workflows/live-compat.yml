name: Live compatibility gates

# L3 gates that require real cloud credentials. These jobs are
# intentionally separate from base.yml so they never become required PR checks.
# Missing secrets produce an explicit skip instead of a false failure, which
# keeps forks and local mirrors usable.
#
# The former Code-era live AI job (DeepSeek agent loop/chat) was deleted with
# its targets in plan-20260920; the surviving surface is `libra cloud` D1/R2
# repository backup, covered by compat-live-cloud.

on:
  schedule:
    # Daily at 04:30 UTC.
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# A newer main commit is handled by cancel-superseded-main.yml, which stops
# this older-SHA job so self-hosted runners can test the newest commit.
# This local group setting only prevents one live run from cancelling another.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live-cloud:
    name: compat-live-cloud
    runs-on: [self-hosted]
    timeout-minutes: 120

    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Check live cloud secrets
        id: gate
        env:
          LIBRA_D1_ACCOUNT_ID: ${{ secrets.LIBRA_D1_ACCOUNT_ID }}
          LIBRA_D1_API_TOKEN: ${{ secrets.LIBRA_D1_API_TOKEN }}
          LIBRA_D1_DATABASE_ID: ${{ secrets.LIBRA_D1_DATABASE_ID }}
          LIBRA_STORAGE_ENDPOINT: ${{ secrets.LIBRA_STORAGE_ENDPOINT }}
          LIBRA_STORAGE_BUCKET: ${{ secrets.LIBRA_STORAGE_BUCKET }}
          LIBRA_STORAGE_ACCESS_KEY: ${{ secrets.LIBRA_STORAGE_ACCESS_KEY }}
          LIBRA_STORAGE_SECRET_KEY: ${{ secrets.LIBRA_STORAGE_SECRET_KEY }}
        run: |
          missing=0
          for name in \
            LIBRA_D1_ACCOUNT_ID \
            LIBRA_D1_API_TOKEN \
            LIBRA_D1_DATABASE_ID \
            LIBRA_STORAGE_ENDPOINT \
            LIBRA_STORAGE_BUCKET \
            LIBRA_STORAGE_ACCESS_KEY \
            LIBRA_STORAGE_SECRET_KEY
          do
            if [ -z "${!name}" ]; then
              echo "::warning::${name} secret is not configured."
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            echo "::warning::Skipping compat-live-cloud because one or more required secrets are missing."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install stable toolchain
        if: steps.gate.outputs.skip != 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Ensure GPUI native libraries
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: bash .github/scripts/ensure-gpui-build-deps.sh

      - name: Run live cloud tests
        if: steps.gate.outputs.skip != 'true'
        env:
          LIBRA_D1_ACCOUNT_ID: ${{ secrets.LIBRA_D1_ACCOUNT_ID }}
          LIBRA_D1_API_TOKEN: ${{ secrets.LIBRA_D1_API_TOKEN }}
          LIBRA_D1_DATABASE_ID: ${{ secrets.LIBRA_D1_DATABASE_ID }}
          LIBRA_STORAGE_ENDPOINT: ${{ secrets.LIBRA_STORAGE_ENDPOINT }}
          LIBRA_STORAGE_BUCKET: ${{ secrets.LIBRA_STORAGE_BUCKET }}
          LIBRA_STORAGE_ACCESS_KEY: ${{ secrets.LIBRA_STORAGE_ACCESS_KEY }}
          LIBRA_STORAGE_SECRET_KEY: ${{ secrets.LIBRA_STORAGE_SECRET_KEY }}
        run: |
          # cloud_storage_backup_test: `libra cloud` D1 index + R2 object round trip.
          # agent_cloud_tombstone_test: D1 agent-capture mirror tombstone propagation.
          # storage_r2_test is L1 in-memory and already runs in base.yml.
          #
          # plan-20260927 G-3a: the run is wrapped in tests/cloud_live_no_skip.sh,
          # which fail-closes on a test-reported live-cloud skip marker, a run/pass
          # mismatch against the JSON-list-pinned selection (22), or a missing
          # Nextest summary; the full wrapped-command log is kept at the printed
          # cloud-live-log= path and echoed by the Retain live gate log step.
          # The selected count is pinned from `cargo nextest list --message-format
          # json --features test-live-cloud --test cloud_storage_backup_test
          # --test agent_cloud_tombstone_test` (21 + 1 = 22); count drift must be
          # re-pinned here and in tests/compat/live_compat_workflow.rs together.
          if ! cargo nextest --version >/dev/null 2>&1; then
            cargo install cargo-nextest --locked --version 0.9.143
          fi
          sh tests/cloud_live_no_skip.sh 22 \
            cargo nextest run --features test-live-cloud \
              --test cloud_storage_backup_test \
              --test agent_cloud_tombstone_test \
              --test-threads=1 --success-output immediate

      - name: Retain live gate log
        if: always()
        run: |
          f=$(ls -t "${TMPDIR:-/tmp}"/libra-cloud-live.* 2>/dev/null | head -n 1 || true)
          if [ -n "$f" ] && [ -f "$f" ]; then
            echo "retaining live gate log: $f"
            cat "$f"
          else
            echo "no libra-cloud-live gate log found (gate skipped or not reached)"
          fi
