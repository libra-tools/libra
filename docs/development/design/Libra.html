<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Libra — Agent Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --paper: #FAF9F6;
    --paper-2: #F4F2EC;
    --ink: #1A1A1A;
    --ink-2: #4A4843;
    --ink-3: #8B877E;
    --rule: #E8E6E0;
    --rule-2: #DBD8D0;
    --accent: oklch(0.62 0.14 250);
    --accent-soft: color-mix(in oklch, var(--accent) 12%, var(--paper));
    --accent-line: color-mix(in oklch, var(--accent) 30%, var(--paper));
    --good: oklch(0.62 0.12 145);
    --good-soft: color-mix(in oklch, var(--good) 14%, var(--paper));
    --warn: oklch(0.68 0.14 65);
    --warn-soft: color-mix(in oklch, var(--warn) 14%, var(--paper));
    --bad: oklch(0.58 0.17 25);
    --bad-soft: color-mix(in oklch, var(--bad) 12%, var(--paper));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--paper); }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  code, .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  #root { height: 100vh; }
  button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  ::selection { background: var(--accent-soft); }
  /* Scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 10px; border: 2px solid var(--paper); }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // Persisted tweak defaults
  window.__TWEAKS__ = /*EDITMODE-BEGIN*/{
    "accent": "oklch(0.62 0.14 250)"
  }/*EDITMODE-END*/;
</script>

<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/Sidebar.jsx"></script>
<script type="text/babel" src="src/Chat.jsx"></script>
<script type="text/babel" src="src/Terminal.jsx"></script>
<script type="text/babel" src="src/Timeline.jsx"></script>
<script type="text/babel" src="src/SummaryReview.jsx"></script>
<script type="text/babel" src="src/Storage.jsx"></script>
<script type="text/babel" src="src/Workflow.jsx"></script>
<script type="text/babel" src="src/Tweaks.jsx"></script>
<script type="text/babel" src="src/App.jsx"></script>
</body>
</html>
