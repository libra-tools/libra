<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Libra — Agent Workspace (Print)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --paper: #FAF9F6;
    --paper-2: #F4F2EC;
    --ink: #1A1A1A;
    --ink-2: #4A4843;
    --ink-3: #8B877E;
    --rule: #E8E6E0;
    --rule-2: #DBD8D0;
    --accent: oklch(0.62 0.14 250);
    --accent-soft: color-mix(in oklch, var(--accent) 12%, var(--paper));
    --accent-line: color-mix(in oklch, var(--accent) 30%, var(--paper));
    --good: oklch(0.62 0.12 145);
    --good-soft: color-mix(in oklch, var(--good) 14%, var(--paper));
    --warn: oklch(0.68 0.14 65);
    --warn-soft: color-mix(in oklch, var(--warn) 14%, var(--paper));
    --bad: oklch(0.58 0.17 25);
    --bad-soft: color-mix(in oklch, var(--bad) 12%, var(--paper));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EDEAE2; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; padding: 0; }
  input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* Fixed-size stage — same pixel dimensions regardless of window */
  #stage {
    width: 1600px; height: 1000px;
    margin: 40px auto;
    background: var(--paper);
    border: 1px solid var(--rule-2);
    box-shadow: 0 10px 40px -10px rgba(0,0,0,0.12);
    overflow: hidden;
    position: relative;
  }
  #root { height: 100%; width: 100%; }

  /* Print — fit stage onto one landscape page exactly */
  @page { size: 1600px 1000px; margin: 0; }
  @media print {
    html, body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #stage {
      margin: 0 !important;
      border: none !important;
      box-shadow: none !important;
      width: 1600px !important;
      height: 1000px !important;
      page-break-after: avoid;
    }
    /* Hide any leftover scrollbars in print */
    * { scrollbar-width: none; }
  }
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>

<script>
  window.__TWEAKS__ = /*EDITMODE-BEGIN*/{
    "accent": "oklch(0.62 0.14 250)"
  }/*EDITMODE-END*/;
  // Pre-seed the persisted panel widths for a balanced print layout
  try {
    localStorage.setItem('libra.sidebarW', '240');
    localStorage.setItem('libra.workflowW', '620');
    localStorage.setItem('libra.termOpen', 'true');
    localStorage.setItem('libra.termH', '220');
  } catch {}
</script>

<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/icons.jsx"></script>
<script type="text/babel" src="src/Sidebar.jsx"></script>
<script type="text/babel" src="src/Chat.jsx"></script>
<script type="text/babel" src="src/Terminal.jsx"></script>
<script type="text/babel" src="src/Timeline.jsx"></script>
<script type="text/babel" src="src/SummaryReview.jsx"></script>
<script type="text/babel" src="src/Workflow.jsx"></script>
<script type="text/babel" src="src/Tweaks.jsx"></script>
<script type="text/babel" src="src/App.jsx"></script>

<script type="text/babel">
(async () => {
  // Wait for fonts + for React to mount + for Babel scripts to transpile
  try { await document.fonts.ready; } catch {}
  // Poll for the app to have rendered real content
  for (let i = 0; i < 60; i++) {
    const root = document.getElementById('root');
    if (root && root.querySelector('aside') && root.querySelector('section')) break;
    await new Promise(r => setTimeout(r, 100));
  }
  // Extra safety delay
  await new Promise(r => setTimeout(r, 500));
  window.print();
})();
</script>
</body>
</html>
