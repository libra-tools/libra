# Compatibility evidence for upstream t4016-diff-quote.sh, migrated in the t4 wave.
# One [[scenario]] per upstream test. The command and flags come from each
# scenario's BODY — what its assertion actually runs — and every flag is checked
# against the real CLI, not the documentation. A scenario that passes a flag Libra
# does not accept is blocked, however well documented the rest of it is.

[[scenario]]
