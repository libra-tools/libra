# Compatibility evidence for upstream t4001-diff-rename.sh, migrated in the t4 wave.
# One [[scenario]] per upstream test. The command and flags come from each
# scenario's BODY — what its assertion actually runs — and every flag is checked
# against the real CLI, not the documentation. A scenario that passes a flag Libra
# does not accept is blocked, however well documented the rest of it is.

[[scenario]]
id = "t4001-diff-rename::setup"
category = "direct"
command_status = "partial"
surface_compatibility = "git-compatible"
surface_evidence = "docs/commands/diff.md#options"
reason = "Compares the artefact an earlier scenario produced with diff; every flag that scenario passes is accepted by Libra (ADR-CT-06 rule 5)."
owner = "libra-compat"
review_date = "2026-08-08"
upstream_revision = "dfb079967b9cbc99e533c21e65f674bb3f5e8b07"
upstream_file = "t4001-diff-rename.sh"
libra_command = "diff"
libra_surface = "diff"
libra_tests = ["command::t4_port_test::t4_port_t4001_setup"]

