command_status = "partial"
surface_compatibility = "git-compatible"
surface_evidence = "COMPATIBILITY.md:176"
reason = "hash-object is partial and every flag this scenario passes is accepted by Libra, with hash-object recorded git-compatible at the cited anchor (ADR-CT-06 rule 5)."
owner = "libra-compat"
review_date = "2026-08-08"
upstream_revision = "dfb079967b9cbc99e533c21e65f674bb3f5e8b07"
upstream_file = "t4010-diff-pathspec.sh"
libra_command = "hash-object"
libra_surface = "hash-object"
libra_tests = ["command::t4_port_test::t4_port_t4010_setup"]

